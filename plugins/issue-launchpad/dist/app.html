<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Issue Launchpad</title>
    <style>:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#fff, #181818));
  --fg: var(--color-text-primary, light-dark(#1a1c1f, #f5f5f5));
  --fg-2: var(--color-text-secondary, light-dark(rgb(26 28 31 / 58%), rgb(255 255 255 / 58%)));
  --surface: color-mix(in oklab, var(--fg) 4%, var(--bg));
  --surface-2: color-mix(in oklab, var(--fg) 8%, var(--bg));
  --line: color-mix(in oklab, var(--fg) 12%, transparent);
  --accent: var(--color-text-info, light-dark(#0a7cff, #83c3ff));
  --accent-bg: color-mix(in oklab, var(--accent) 13%, var(--bg));
  --on-accent: light-dark(#fff, #0d0d0d);
  --green: light-dark(#1a7f37, #3fb950);
  --purple: light-dark(#8250df, #ab7df8);
  --red: light-dark(#cf222e, #f85149);
  --amber: light-dark(#9a6700, #d29922);
  --r: 8px;
  --detail-w: 440px;
  font: 13.5px/1.45 var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: var(--cursor-interaction, pointer); }
[hidden] { display: none !important; }
.spacer { flex: 1; }
.muted { color: var(--fg-2); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------------------------------------ layout */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; min-width: 0; }
.topbar { position: relative; min-height: 54px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; margin-right: 6px; white-space: nowrap; }
.brand svg { color: var(--on-accent); background: var(--accent); border-radius: 6px; padding: 5px; width: 22px; height: 22px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; position: relative; }
.has-detail main { grid-template-columns: minmax(0, 1fr) var(--detail-w); }

/* Codex floats its composer over the bottom of the app; keep content clear of it. */
.host-codex main { padding-bottom: 96px; }
.host-codex .brand { display: none; }
.host-codex .tray, .host-codex .toast { bottom: 108px; }
.view { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

.viewer { display: flex; align-items: center; gap: 7px; padding: 3px 10px 3px 3px; border: 1px solid var(--line); border-radius: 99px; color: var(--fg-2); font-size: 12.5px; }
.viewer img { border-radius: 50%; }

/* ---------------------------------------------------------- controls */
button, select, input[type="text"], input:not([type]), textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: var(--r); padding: 6px 10px;
}
button { background: var(--surface); transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { background: var(--surface-2); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
button.primary:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 88%, var(--fg)); }
button.primary.danger { background: var(--amber); }
button.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
button.ghost:hover { color: var(--fg); }
.icon-btn { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; background: transparent; border-color: transparent; color: var(--fg-2); }
.icon-btn:hover { color: var(--fg); }
select { padding-right: 6px; max-width: 230px; background: var(--bg); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 6px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 14%), 0 0 0 1px var(--line); }
.seg button:hover:not(.on) { background: transparent; color: var(--fg); }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r); padding: 0 10px; min-width: 260px; flex: 0 1 380px; background: var(--bg); color: var(--fg-2); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); }
.search input { border: 0; background: transparent; padding: 7px 0; width: 100%; outline: 0; color: var(--fg); }
.search.small { min-width: 170px; flex: 0 1 220px; }
.search.small input { padding: 5px 0; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); user-select: none; white-space: nowrap; }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px 8px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.chip { padding: 2px 10px; border-radius: 99px; font-size: 12px; background: transparent; color: var(--fg-2); }
.chip.on { background: var(--accent-bg); border-color: color-mix(in oklab, var(--accent) 45%, transparent); color: var(--accent); }
.count { padding: 2px 16px 8px; color: var(--fg-2); font-size: 12px; min-height: 22px; }

.check { width: 17px; height: 17px; padding: 0; border-radius: 5px; display: grid; place-items: center; background: var(--bg); border-color: color-mix(in oklab, var(--fg) 30%, transparent); flex: none; color: var(--on-accent); }
.check.on { background: var(--accent); border-color: var(--accent); }

/* -------------------------------------------------------------- list */
.list-scroll { overflow: auto; flex: 1; min-height: 0; padding: 0 8px 24px; }
.dim { opacity: .6; transition: opacity .15s; } /* muted, never blocked: stays clickable */
.rows { list-style: none; margin: 0; padding: 0; }
.group-head { display: flex; gap: 8px; align-items: center; margin: 14px 10px 4px; font-size: 12px; color: var(--fg-2); font-weight: 600; letter-spacing: .01em; }
.group-head span { background: var(--surface-2); border-radius: 99px; padding: 0 7px; font-weight: 500; }

.row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; position: relative; cursor: pointer; border: 1px solid transparent; }
.row + .row { margin-top: 1px; }
.row:hover { background: var(--surface); }
.row.focused { background: var(--accent-bg); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
.row.checked:not(.focused) { background: color-mix(in oklab, var(--accent) 7%, var(--bg)); }
.row .main { flex: 1; min-width: 0; }
.row .title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .t { font-weight: 560; overflow-wrap: anywhere; }
.sub { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--fg-2); font-size: 12px; margin-top: 2px; align-items: center; }
.sub .repo { color: var(--fg); opacity: .8; font-weight: 500; }
.with-icon { display: inline-flex; align-items: center; gap: 4px; }
.proj { border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }
.quick { width: 26px; height: 26px; padding: 0; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 0; opacity: 0; transform: scale(.85); transition: opacity .12s, transform .12s; flex: none; }
.row:hover .quick, .row:focus-within .quick, .card:hover .quick, .card:focus-within .quick, .row.focused .quick { opacity: 1; transform: none; }
.quick:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 85%, var(--fg)); }
.more-btn { display: block; margin: 14px auto; }

.state { flex: none; }
.state.open { color: var(--green); }
.state.closed, .state.merged { color: var(--purple); }
.state.draft { color: var(--fg-2); }

.label { display: inline-block; font-size: 11.5px; line-height: 17px; padding: 0 7px; border-radius: 99px; border: 1px solid; white-space: nowrap; }
.avatars { display: inline-flex; align-items: center; flex: none; }
.avatars img { border-radius: 50%; border: 2px solid var(--bg); margin-left: -6px; background: var(--surface-2); }
.avatars img:first-child { margin-left: 0; }
.avatars .more { font-size: 11px; color: var(--fg-2); margin-left: 4px; }

/* ------------------------------------------------------------- board */
.banner { margin: 0 16px 8px; padding: 6px 10px; border-radius: var(--r); background: color-mix(in oklab, var(--amber) 14%, var(--bg)); color: var(--amber); font-size: 12px; }
.board { display: flex; gap: 12px; overflow: auto; padding: 4px 16px 20px; flex: 1; min-height: 0; align-items: flex-start; }
.column { flex: 0 0 276px; max-height: 100%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-height: 0; }
.column.empty-col { flex-basis: 170px; opacity: .75; }
.project-select { max-width: 340px; min-width: 220px; }
.column h4 { display: flex; align-items: center; gap: 8px; margin: 0; padding: 10px 12px; font-size: 13px; font-weight: 650; }
.column h4 i { width: 9px; height: 9px; border-radius: 50%; }
.column h4 span { margin-left: auto; color: var(--fg-2); font-weight: 500; font-size: 12px; }
.column ul { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.col-empty { color: var(--fg-2); text-align: center; padding: 14px 0; font-size: 12px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.card:hover { border-color: color-mix(in oklab, var(--fg) 28%, transparent); }
.card.focused { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent); }
.card.checked { background: color-mix(in oklab, var(--accent) 7%, var(--bg)); }
.card-top, .card-foot { display: flex; align-items: center; gap: 6px; }
.card-top .sub, .card-foot .sub { margin: 0; }
.card-title { font-weight: 560; overflow-wrap: anywhere; }
.card-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.field { font-size: 11.5px; padding: 0 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2); line-height: 18px; }
.card .quick { width: 22px; height: 22px; margin-left: 4px; }

/* ------------------------------------------------------------ detail */
.detail { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.detail header { display: flex; align-items: center; padding: 10px 12px 10px 16px; gap: 8px; border-bottom: 1px solid var(--line); }
.crumb { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; color: var(--fg-2); font-size: 12.5px; }
.crumb span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-weight: 500; }
.pill { font-size: 11px; padding: 0 8px; line-height: 18px; border-radius: 99px; text-transform: capitalize; background: color-mix(in oklab, var(--green) 18%, transparent); color: var(--green); font-weight: 600; }
.pill.closed, .pill.merged { background: color-mix(in oklab, var(--purple) 18%, transparent); color: var(--purple); }
.pill.draft { background: var(--surface-2); color: var(--fg-2); }
.head-actions { display: flex; }
.detail .scroll { min-height: 140px; overflow: auto; padding: 14px 16px; flex: 1; min-height: 0; }
.detail h2 { font-size: 17px; line-height: 1.3; margin: 0 0 8px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--fg-2); font-size: 12.5px; margin-bottom: 12px; align-items: center; }
.meta b { color: var(--fg); font-weight: 560; }
.facts { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; margin-bottom: 14px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fact { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.fact > span:first-child { color: var(--fg-2); width: 74px; flex: none; }
.status { font-style: normal; margin-left: 8px; font-size: 11.5px; background: var(--accent-bg); color: var(--accent); border-radius: 5px; padding: 0 7px; }
.linked { display: grid; gap: 6px; margin-bottom: 12px; }
.linked-pr { text-align: left; display: flex; gap: 8px; align-items: center; font-size: 12.5px; }
.error-text { color: var(--red); font-size: 12.5px; }
.body-loading i { display: block; height: 11px; border-radius: 4px; background: var(--surface-2); margin: 10px 0; animation: pulse 1.2s infinite; }
.comments { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
.comments summary { cursor: pointer; color: var(--fg-2); font-weight: 560; }
.comment { margin-top: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.comment .meta { margin-bottom: 4px; }

.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 8px; }
.md h3, .md h4, .md h5, .md h6 { margin: 14px 0 6px; font-size: 14px; }
.md ul, .md ol { padding-left: 20px; margin: 4px 0 10px; }
.md ul.tasks { list-style: none; padding-left: 2px; }
.md .box { display: inline-grid; place-items: center; width: 14px; height: 14px; border: 1px solid var(--fg-2); border-radius: 4px; margin-right: 7px; font-size: 10px; vertical-align: -2px; }
.md li.done { color: var(--fg-2); text-decoration: line-through; }
.md li.done .box { background: var(--green); border-color: var(--green); color: #fff; }
.md pre { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow: auto; margin: 8px 0; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--fg-2); }
.md a { color: var(--accent); text-decoration: none; }
.md a:hover { text-decoration: underline; }

.launch { max-height: 58%; overflow: auto; flex: none; border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 8px; background: var(--surface); }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.modes button { border-radius: 99px; padding: 3px 12px; background: var(--bg); }
.modes button.on { background: var(--accent-bg); border-color: color-mix(in oklab, var(--accent) 50%, transparent); color: var(--accent); font-weight: 600; }
.hint { margin: 0; font-size: 12px; color: var(--fg-2); }
.launch textarea { width: 100%; resize: vertical; min-height: 40px; max-height: 160px; }
.launch-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.launch-actions .primary { flex: 1 1 auto; justify-content: center; padding: 8px 14px; }
.prompt-preview { margin: 0; max-height: 130px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }

/* -------------------------------------------------------- tray/toast */
.tray { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--line); padding: 8px 10px 8px 16px; border-radius: 14px; box-shadow: 0 10px 34px rgb(0 0 0 / 28%); width: min(640px, calc(100% - 32px)); z-index: 5; }
.has-detail .tray { left: calc((100% - var(--detail-w)) / 2); width: min(640px, calc(100% - var(--detail-w) - 32px)); }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-weight: 500; box-shadow: 0 6px 24px rgb(0 0 0 / 30%); z-index: 9; max-width: 380px; animation: pop .18s ease-out; }
.toast.err { background: var(--red); color: #fff; }
.has-detail .toast { right: calc(var(--detail-w) + 20px); }

/* ------------------------------------------------------- empty/skel */
.empty { text-align: center; padding: 56px 24px; color: var(--fg-2); max-width: 460px; margin: 0 auto; }
.empty svg { opacity: .6; }
.empty h3 { color: var(--fg); margin: 12px 0 6px; font-size: 16px; }
.empty p { margin: 0; }
.fatal { display: grid; place-items: center; align-content: center; gap: 14px; height: 100%; padding: 24px; }
.fatal .prompt-preview { max-width: 460px; width: 100%; }
.skeleton { padding: 4px 8px; }
.sk-row { display: flex; gap: 12px; padding: 12px 10px; align-items: center; }
.sk-row > div { flex: 1; display: grid; gap: 8px; }
.sk-row i, .skeleton i { display: block; height: 12px; border-radius: 5px; background: var(--surface-2); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ------------------------------------------------------- responsive */
@media (max-width: 900px) {
  .has-detail main { grid-template-columns: minmax(0, 1fr); }
  .has-detail .detail { position: absolute; inset: 0; z-index: 4; border-left: 0; }
  .has-detail .toast { right: 20px; }
  .brand { display: none; }
  .search { min-width: 0; flex: 1 1 140px; }
}

/* ------------------------------------------------------------ resizer */
.resizer { position: absolute; top: 0; bottom: 0; right: calc(var(--detail-w) - 5px); width: 10px; cursor: col-resize; z-index: 6; touch-action: none; }
.resizer::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .12s; border-radius: 2px; }
.resizer:hover::after, .resizer:focus-visible::after, body.resizing .resizer::after { background: var(--accent); }
.resizer:focus-visible { outline: 0; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe, body.resizing * { cursor: col-resize !important; }
.launch-actions.secondary button { flex: 1 1 auto; }
.launch-actions.secondary .ghost { flex: 0 0 auto; }
.hint.small { font-size: 11.5px; }
.hint b { color: var(--fg); font-weight: 560; }
.launch .prompt-edit { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 220px; min-height: 120px; }
.reset { justify-self: start; padding: 0; font-size: 12px; }
@media (max-width: 900px) { .resizer { display: none; } }

/* ------------------------------------------------------- loading cues */
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; opacity: 0; transition: opacity .25s .15s; pointer-events: none; }
.progress.on { opacity: 1; }
.progress::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 38%; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: slide 1.15s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(270%); } }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn.spin svg { animation: spin .9s linear infinite; }
.spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid color-mix(in oklab, var(--fg) 20%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .75s linear infinite; flex: none; }
.note { display: inline-flex; align-items: center; gap: 7px; }
.filters .note { font-size: 12px; margin-left: 4px; }
button.link { padding: 0 2px; color: var(--accent); text-decoration: underline; }
@media (prefers-reduced-motion: reduce) {
  .progress::before { animation: none; }
  .progress.on::before { width: 100%; opacity: .45; background: var(--accent); transform: none; }
  .spinner { border-top-color: var(--fg-2); }
}

/* ------------------------------------------------------ GitHub host */
.host-select { max-width: 200px; padding: 4px 8px; font-size: 12.5px; color: var(--fg-2); }
.host-badge { font-size: 12px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
</style>
